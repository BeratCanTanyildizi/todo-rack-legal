<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo Rack — Takima katil</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #0f172a;
      padding: 24px;
    }
    .kutu { max-width: 420px; text-align: center; }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; margin: 0 0 8px; }
    p { font-size: 15px; color: #64748b; line-height: 1.45; margin: 0 0 24px; }
    a.dugme {
      display: block;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    a.ikincil { background: #fff; color: #0f172a; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="kutu">
    <h1>Todo Rack</h1>
    <p>Takima katilmak icin uygulamayi acin. Yuklu degilse magazadan indirin, sonra ayni linke tekrar dokunun.</p>
    <a class="dugme" id="uygulama" href="#">Uygulamayi ac</a>
    <a class="dugme ikincil" id="magaza" href="https://play.google.com/store/apps/details?id=com.todorack.todo_rack">Google Play'den indir</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var takimId = params.get("takimId") || "";
      var qr = params.get("qr") || "";
      var deep =
        "todorack://join?takimId=" +
        encodeURIComponent(takimId) +
        "&qr=" +
        encodeURIComponent(qr);
      var play =
        "https://play.google.com/store/apps/details?id=com.todorack.todo_rack";
      var appStore = "https://apps.apple.com/search?term=Todo%20Rack";
      var ua = navigator.userAgent || "";
      var android = /android/i.test(ua);
      var ios = /iPhone|iPad|iPod/i.test(ua);
      var magaza = android ? play : ios ? appStore : play;

      document.getElementById("uygulama").href = deep;
      document.getElementById("magaza").href = magaza;

      if (!takimId || !qr) return;

      if (android) {
        location.href =
          "intent://join?takimId=" +
          encodeURIComponent(takimId) +
          "&qr=" +
          encodeURIComponent(qr) +
          "#Intent;scheme=todorack;package=com.todorack.todo_rack;S.browser_fallback_url=" +
          encodeURIComponent(play) +
          ";end";
        return;
      }

      if (ios) {
        var zamanlayici = setTimeout(function () {
          location.href = appStore;
        }, 1400);
        window.addEventListener("pagehide", function () {
          clearTimeout(zamanlayici);
        });
        window.addEventListener("blur", function () {
          clearTimeout(zamanlayici);
        });
        location.href = deep;
      }
    })();
  </script>
</body>
</html>
